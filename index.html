<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine! 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d4145a;
            --primary-dark: #a01045;
            --secondary: #fbb6ce;
            --accent: #f472b6;
            --cream: #fff7ed;
            --dark: #1a1a1a;
            --shadow-soft: 0 20px 60px rgba(212, 20, 90, 0.15);
            --shadow-hard: 0 30px 80px rgba(212, 20, 90, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background: linear-gradient(135deg, #fef3f7 0%, #fde8ef 50%, #fcd7e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background elements */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(244, 114, 182, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            top: -200px;
            right: -200px;
            animation: pulse-glow 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(251, 182, 206, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            animation: pulse-glow 10s ease-in-out infinite reverse;
        }

        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            padding: 80px 60px;
            border-radius: 40px;
            box-shadow: var(--shadow-hard);
            max-width: 600px;
            width: 90%;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: container-enter 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, var(--accent), var(--primary), var(--secondary));
            border-radius: 40px;
            z-index: -1;
            opacity: 0.2;
            filter: blur(20px);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            line-height: 1.2;
            letter-spacing: -0.02em;
            animation: text-shimmer 3s ease-in-out infinite;
        }

        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8em;
            font-weight: 600;
            color: var(--primary-dark);
            margin-top: 25px;
            margin-bottom: 15px;
            line-height: 1.4;
            letter-spacing: 0.01em;
            opacity: 0;
            animation: fade-up 0.8s ease 0.4s forwards;
        }

        .success h2 {
            margin-top: 30px;
            font-size: 1.6em;
            opacity: 0;
            animation: fade-up 0.8s ease 0.7s forwards;
        }

        .subtitle {
            font-size: 1.3em;
            color: #6b7280;
            margin-bottom: 50px;
            font-weight: 300;
            letter-spacing: 0.05em;
            opacity: 0;
            animation: fade-up 0.8s ease 0.3s forwards;
        }

        .success .subtitle {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .emoji-container {
            margin-bottom: 30px;
            opacity: 0;
            animation: fade-up 0.8s ease 0.1s forwards;
        }

        .emoji {
            font-size: 5em;
            display: inline-block;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(212, 20, 90, 0.2));
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin-top: 50px;
            opacity: 0;
            animation: fade-up 0.8s ease 0.5s forwards;
        }

        button {
            padding: 18px 45px;
            font-size: 1.3em;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 0.03em;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:active::before {
            width: 300px;
            height: 300px;
        }

        #yesBtn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(212, 20, 90, 0.3);
            transform-origin: center;
            z-index: 2;
        }

        #yesBtn:hover {
            box-shadow: 0 15px 40px rgba(212, 20, 90, 0.4);
            transform: translateY(-3px);
        }

        #noBtn {
            background: #f3f4f6;
            color: #6b7280;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 1;
        }

        #noBtn:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
        }

        .success {
            display: none;
            opacity: 0;
        }

        .success.active {
            display: block;
            animation: fade-in 0.8s ease forwards;
        }

        .question.hidden {
            display: none;
        }

        .message-box {
            margin-top: 40px;
            text-align: left;
            opacity: 0;
            animation: fade-up 0.8s ease 0.6s forwards;
        }

        .message-box label {
            display: block;
            color: var(--primary);
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1.4em;
            letter-spacing: 0.02em;
        }

        .message-box textarea {
            width: 100%;
            padding: 20px;
            font-size: 1.1em;
            font-family: 'Cormorant Garamond', serif;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            resize: vertical;
            min-height: 140px;
            outline: none;
            transition: all 0.4s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            line-height: 1.6;
        }

        .message-box textarea:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(212, 20, 90, 0.15);
            transform: translateY(-2px);
        }

        .message-box textarea::placeholder {
            color: #9ca3af;
            font-style: italic;
        }

        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1000;
        }

        .heart {
            position: absolute;
            font-size: 2em;
            animation: fall 5s linear infinite;
            opacity: 0;
            filter: drop-shadow(0 5px 10px rgba(212, 20, 90, 0.3));
        }

        /* Decorative elements */
        .deco-heart {
            position: absolute;
            font-size: 1.5em;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .deco-heart:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; }
        .deco-heart:nth-child(2) { top: 20%; right: 8%; animation-delay: 1s; font-size: 1em; }
        .deco-heart:nth-child(3) { bottom: 15%; left: 10%; animation-delay: 2s; font-size: 1.2em; }
        .deco-heart:nth-child(4) { bottom: 25%; right: 5%; animation-delay: 1.5s; }

        /* Animations */
        @keyframes container-enter {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fade-in {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes pulse-glow {
            0%, 100% { 
                transform: scale(1);
                opacity: 0.5;
            }
            50% { 
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-15px) rotate(2deg);
            }
            75% {
                transform: translateY(-10px) rotate(-2deg);
            }
        }

        @keyframes fall {
            0% {
                top: -10%;
                opacity: 0;
                transform: translateX(0) rotate(0deg);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                top: 110%;
                opacity: 0;
                transform: translateX(100px) rotate(360deg);
            }
        }

        @keyframes text-shimmer {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-10px) rotate(-2deg); }
            75% { transform: translateX(10px) rotate(2deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 60px 40px;
            }

            h1 {
                font-size: 2.5em;
            }

            h2 {
                font-size: 1.4em;
            }

            .subtitle {
                font-size: 1.1em;
            }

            .emoji {
                font-size: 3.5em;
            }

            button {
                padding: 15px 35px;
                font-size: 1.1em;
            }

            .buttons {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    
    <div class="hearts" id="hearts"></div>
    
    <div class="container">
        <div class="deco-heart">💗</div>
        <div class="deco-heart">💖</div>
        <div class="deco-heart">💕</div>
        <div class="deco-heart">💝</div>

        <div class="question" id="question">
            <div class="emoji-container">
                <div class="emoji">💕</div>
            </div>
            <h1>Happy Valentine YAAAAA!!!!!</h1>
            <p class="subtitle">A question from the heart</p>
            <h2>Kamu udah naksir aku belom??? HEHE</h2>
            <div class="buttons">
                <button id="yesBtn">UDAH!!!</button>
                <button id="noBtn">BELOM</button>
            </div>
        </div>

        <div class="success" id="success">
            <div class="emoji-container">
                <div class="emoji">💝</div>
            </div>
            <h1>I KNEW IT! UDAH JELAS LAH HAHAHAHAHA</h1>
            <p class="subtitle">Since aku blm bisa kasih km anything physically, the best i can do adalah ini hehehe</p>
            <h2>COKLAT BUNGA SEMUA MUANYA NANTI YA!</h2>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const question = document.getElementById('question');
        const success = document.getElementById('success');
        const heartsContainer = document.getElementById('hearts');

        let yesSize = 1;
        let noClickCount = 0;

        noBtn.addEventListener('click', () => {
            noClickCount++;
            yesSize += 0.25;
            yesBtn.style.transform = `scale(${yesSize})`;
            
            // Shake animation
            noBtn.style.animation = 'shake 0.5s';
            setTimeout(() => {
                noBtn.style.animation = '';
            }, 500);

            // Change button text on repeated clicks
            if (noClickCount === 3) {
                noBtn.textContent = 'YAKIN?';
            } else if (noClickCount === 5) {
                noBtn.textContent = 'YAKIN BANGET BELOM?';
            } else if (noClickCount === 7) {
                noBtn.textContent = 'COBA DIPIKIRKAN ULANG DENGAN LOGIKA';
            }
        });

        yesBtn.addEventListener('click', () => {
            question.classList.add('hidden');
            success.classList.add('active');
            createHearts();
        });

        function createHearts() {
            const heartTypes = ['❤️', '💕', '💖', '💗', '💝', '💘'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    heart.textContent = heartTypes[Math.floor(Math.random() * heartTypes.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDelay = Math.random() * 2 + 's';
                    heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                    heart.style.fontSize = (Math.random() * 1.5 + 1) + 'em';
                    heartsContainer.appendChild(heart);

                    setTimeout(() => {
                        heart.remove();
                    }, 7000);
                }, i * 100);
            }
        }

        // Add sparkle cursor effect (optional enhancement)
        let lastSparkle = 0;
        document.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastSparkle > 100) {
                createSparkle(e.clientX, e.clientY);
                lastSparkle = now;
            }
        });

        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.style.position = 'fixed';
            sparkle.style.left = x + 'px';
            sparkle.style.top = y + 'px';
            sparkle.style.width = '4px';
            sparkle.style.height = '4px';
            sparkle.style.borderRadius = '50%';
            sparkle.style.background = 'radial-gradient(circle, var(--accent), transparent)';
            sparkle.style.pointerEvents = 'none';
            sparkle.style.zIndex = '9999';
            sparkle.style.animation = 'sparkle-fade 0.8s ease-out forwards';
            document.body.appendChild(sparkle);

            setTimeout(() => sparkle.remove(), 800);
        }

        // Add sparkle animation
        const sparkleStyle = document.createElement('style');
        sparkleStyle.textContent = `
            @keyframes sparkle-fade {
                0% {
                    opacity: 1;
                    transform: scale(1);
                }
                100% {
                    opacity: 0;
                    transform: scale(2);
                }
            }
        `;
        document.head.appendChild(sparkleStyle);
    </script>
</body>
</html>
